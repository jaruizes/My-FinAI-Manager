# FD004 — Portfolio Valuation read contract (mirror fragment)
#
# Authoritative copy is merged into implementation/platform/contracts/openapi/openapi.yaml.
# OpenAPI 3.0.3 (platform swagger-request-validator requires 3.0.x). Contract-first (FR-024).
# Business language only — no entity / column / JPA / Finnhub name (FR-027, SC-007).
# FD003's GET /api/portfolios[/{portfolioId}] and the Portfolio schema are UNCHANGED — this is additive.

openapi: 3.0.3
info:
  title: My-FinAI-Manager — Portfolio Valuation (FD004)
  version: 0.4.0

paths:
  /api/portfolios/{portfolioId}/valuation:
    get:
      operationId: getPortfolioValuation
      summary: Get the latest valuation snapshot for a Portfolio
      description: >
        Returns the latest deterministic valuation of the Portfolio: status, when it was calculated,
        total value in EUR and USD, per-Position valuation (price, native/EUR/USD value, weight,
        sector, price-observed-at), and sector allocation. A Portfolio that exists but has no
        valuation snapshot yet returns status PENDING with null monetary fields. The valuation is
        read-only; no field can be edited (FR-032).
      tags: [Portfolios]
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Portfolio identifier. A value that is not a UUID yields 400.
      responses:
        '200':
          description: The latest valuation snapshot (or a PENDING placeholder if none computed yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValuation'
        '400':
          description: portfolioId is not a valid UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No Portfolio with that id for the current Investor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/portfolio-not-found
                title: Portfolio not found
                status: 404
                detail: No portfolio with id 3fa85f64-5717-4562-b3fc-2c963f66afa6

components:
  schemas:

    PortfolioValuation:
      type: object
      required: [portfolioId, status, positions, sectors]
      properties:
        portfolioId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, COMPLETED, PARTIAL, FAILED]
          description: >
            PENDING — no snapshot computed yet. COMPLETED — every Position valued (price + needed FX);
            a missing sector alone does not prevent COMPLETED. PARTIAL — some Position unvalued, or a
            needed FX rate missing, or only one total producible. FAILED — no Position could be
            valued, or neither total could be produced. (FR-015..FR-018)
        calculatedAt:
          type: string
          format: date-time
          nullable: true
          description: When this snapshot was computed. Null only for the PENDING placeholder.
        totalValueEUR:
          type: string
          nullable: true
          description: Decimal string, full precision. Null when not producible (never "0").
        totalValueUSD:
          type: string
          nullable: true
        marketDataAsOf:
          type: string
          format: date-time
          nullable: true
          description: Oldest market-price observation time among valued Positions.
        fxDataAsOf:
          type: string
          format: date-time
          nullable: true
          description: Oldest FX-rate observation time among the rates used.
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionValuation'
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/SectorAllocation'

    PositionValuation:
      type: object
      required: [ticker, market, quantity, nativeCurrency, valued, sector]
      properties:
        ticker:
          type: string
        market:
          type: string
          description: Market Identifier Code (MIC), e.g. XNAS, XMAD.
        quantity:
          type: string
          description: Decimal string.
        nativeCurrency:
          type: string
          enum: [EUR, USD]
        valued:
          type: boolean
          description: True when a market price was available. When false, every monetary field below is null (never "0"). (FR-017)
        marketPrice:
          type: string
          nullable: true
        nativeMarketValue:
          type: string
          nullable: true
          description: quantity × marketPrice, full precision.
        valueInEUR:
          type: string
          nullable: true
        valueInUSD:
          type: string
          nullable: true
        portfolioWeight:
          type: string
          nullable: true
          description: >
            Fraction of the Portfolio's total EUR value (e.g. "0.761904761905"). Client multiplies by
            100 and formats to 2 dp. Null when there is no EUR basis. (FR-009, FR-031)
        sector:
          type: string
          description: Provider classification string shown directly, or "Unclassified". No taxonomy. (FR-014)
        priceObservedAt:
          type: string
          format: date-time
          nullable: true

    SectorAllocation:
      type: object
      required: [sector, sectorValueEUR, sectorWeight]
      properties:
        sector:
          type: string
        sectorValueEUR:
          type: string
          description: Σ of valueInEUR for that sector's valued Positions, full precision.
        sectorWeight:
          type: string
          description: Fraction (sectorValueEUR ÷ totalValueEUR). Client multiplies by 100, 2 dp.

    # Problem is already defined in openapi.yaml (RFC 9457) — shown here for the fragment to validate standalone.
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
