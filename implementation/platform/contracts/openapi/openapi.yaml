openapi: 3.0.3
info:
  title: My-FinAI-Manager Platform API
  version: 0.1.0
  description: >
    External business API for My-FinAI-Manager.

    FD001 — Create Investment Portfolio adds `POST /api/portfolios`.
    FD003 — List and View Portfolio Details adds `GET /api/portfolios` (the current investor's
    saved portfolios, newest first) and `GET /api/portfolios/{portfolioId}` (one portfolio with
    its positions). Both are read-only — no sorting, filtering, searching, or pagination.
    EN004 — Establish Financial Instrument Reference Data adds `GET /api/financial-instruments`
    (the catalog search FD002 uses for controlled instrument selection).
    Editing, valuation, risk and recommendations are not part of this version.
    Operational backend/database health is exposed via the Spring Boot Actuator health mechanism at
    `/actuator/health` and is intentionally not modelled here.
servers:
  - url: http://localhost:8080
    description: Local development (started via implementation/platform/start.sh)

paths:
  /api/portfolios:
    post:
      operationId: createPortfolio
      tags: [Portfolio]
      summary: Create an investment portfolio with its initial positions
      description: >
        Creates one portfolio owned by the current investor, with one or more initial positions,
        after validating it against the portfolio business rules. The whole portfolio is persisted
        atomically or not at all.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            A client-generated unique value for one creation attempt. Re-sending the same key
            (e.g. after a network retry) returns the portfolio already created for it instead of
            creating a second one.
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortfolioRequest'
            examples:
              oneMinimalPosition:
                summary: Name + one position, no optional acquisition data
                value:
                  name: Long-Term Growth
                  positions:
                    - ticker: ASML
                      market: XAMS
                      quantity: "12"
                      currency: EUR
              multiplePositions:
                summary: Several positions, some with acquisition data
                value:
                  name: Dividend Portfolio
                  positions:
                    - ticker: ASML
                      market: XAMS
                      quantity: "3"
                      currency: EUR
                      initialPurchaseDate: "2024-05-14"
                      averagePurchasePrice: "812.50"
                    - ticker: MSFT
                      market: XNAS
                      quantity: "10"
                      currency: USD
      responses:
        '201':
          description: Portfolio created.
          headers:
            Location:
              schema: { type: string }
              description: Resource path of the created portfolio (not yet retrievable in this version).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '200':
          description: >
            The `Idempotency-Key` was already used — the portfolio created for it is returned
            unchanged. No second portfolio is created.
          headers:
            Idempotency-Replayed:
              schema: { type: boolean }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '400':
          description: >
            The portfolio or one of its positions breaks a business rule. Nothing is persisted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                missingNameAndDuplicate:
                  value:
                    type: /problems/portfolio-validation
                    title: Portfolio could not be validated
                    status: 400
                    detail: The portfolio has 2 problems that need to be fixed.
                    errors:
                      - field: name
                        code: REQUIRED
                        message: Portfolio name is required.
                      - field: positions[1]
                        code: DUPLICATE_INSTRUMENT
                        message: A position for ASML on XAMS already exists in this portfolio.
                notInCatalog:
                  summary: A position references an instrument/market/currency that is not a selectable catalogued listing (FD002)
                  value:
                    type: /problems/portfolio-validation
                    title: Portfolio could not be validated
                    status: 400
                    detail: The portfolio has 1 problem that needs to be fixed.
                    errors:
                      - field: positions[0]
                        code: INSTRUMENT_NOT_IN_CATALOG
                        message: AAPL on XMAD in EUR is not a selectable instrument.
        '415':
          description: Unsupported media type.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: >
            The portfolio was valid but could not be saved (transient problem). Nothing was
            persisted; the client may retry with the same `Idempotency-Key`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notSaved:
                  value:
                    type: /problems/portfolio-not-saved
                    title: Portfolio could not be saved
                    status: 503
                    detail: We could not save your portfolio right now. Please try again.
    get:
      operationId: listPortfolios
      tags: [Portfolio]
      summary: List the current investor's saved portfolios
      description: >
        Returns every portfolio persisted for the current investor, most-recently-created first.
        Each item carries only the portfolio identifier, its name, and the number of positions it
        currently contains — not the positions themselves (use the detail operation for those). An
        investor with no saved portfolios gets `200` with an empty array (never `404`). No sorting,
        filtering, searching, or pagination.
      responses:
        '200':
          description: Zero or more portfolio summaries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioSummary'
              examples:
                two:
                  summary: Two saved portfolios
                  value:
                    - id: 6f9619ff-8b86-4d11-b42d-00c04fc964ff
                      name: Long Term Investment
                      positionCount: 8
                    - id: 2b1c3d4e-5f60-4a71-8293-a4b5c6d7e8f9
                      name: Technology
                      positionCount: 4
                none:
                  summary: No portfolios — empty array, not 404
                  value: []

  /api/portfolios/{portfolioId}:
    get:
      operationId: getPortfolio
      tags: [Portfolio]
      summary: Get a portfolio and its persisted positions
      description: >
        Returns the selected portfolio (name, status, creation time) and one entry per persisted
        position (ticker, market/MIC, quantity, currency, and the initial purchase date / average
        purchase price when the position has them). Read-only — nothing about the portfolio can be
        changed through this operation. A well-formed portfolio id that is not the current
        investor's yields `404`; a `{portfolioId}` segment that is not a valid UUID yields `400`.
      parameters:
        - name: portfolioId
          in: path
          required: true
          description: >
            The portfolio identifier from the list operation. Must be a UUID — a non-UUID segment
            is rejected with `400` before any lookup.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The portfolio and its positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '400':
          description: >
            The `{portfolioId}` path segment is not a valid identifier (not a UUID). Rejected
            before any lookup; the body carries no guaranteed problem `type`.
        '404':
          description: No portfolio with this id belongs to the current investor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/portfolio-not-found
                title: Portfolio not found
                status: 404
                detail: No portfolio with that identifier exists.
                instance: /api/portfolios/6f9619ff-8b86-4d11-b42d-00c04fc964ff

  /api/portfolios/{portfolioId}/valuation:
    get:
      operationId: getPortfolioValuation
      tags: [Portfolio]
      summary: Get the latest valuation snapshot for a portfolio
      description: >
        Returns the latest deterministic valuation of the portfolio: status, when it was
        calculated, total value in EUR and USD, one entry per position (market price, native / EUR /
        USD value, portfolio weight, sector, price-observed-at — each present only when the position
        could be valued), and the sector allocation. A portfolio that exists but has no valuation
        snapshot yet returns status `PENDING` with null monetary fields. Read-only — no value can be
        edited. A `{portfolioId}` segment that is not a valid UUID yields `400`; a well-formed id
        that is not the current investor's yields `404`. Missing market data is never shown as `0`.
      parameters:
        - name: portfolioId
          in: path
          required: true
          description: The portfolio identifier. Must be a UUID — a non-UUID segment yields `400`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The latest valuation snapshot (or a `PENDING` placeholder if none computed yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValuation'
        '400':
          description: >
            The `{portfolioId}` path segment is not a valid identifier (not a UUID). Rejected
            before any lookup; the body carries no guaranteed problem `type`.
        '404':
          description: No portfolio with this id belongs to the current investor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/portfolio-not-found
                title: Portfolio not found
                status: 404
                detail: No portfolio with that identifier exists.
                instance: /api/portfolios/6f9619ff-8b86-4d11-b42d-00c04fc964ff

  /api/financial-instruments:
    get:
      operationId: searchFinancialInstruments
      tags: [Financial Instruments]
      summary: Search the Financial Instrument catalog
      description: >
        Returns catalogued Financial Instrument listings whose ticker exactly matches (case
        insensitive) the query, or whose name contains it (case insensitive). Only listings that
        may currently be selected for a new Position are returned: active and priced in EUR or USD.
        Exact-ticker matches are listed first, then name matches, each block ordered by ticker. An
        empty result is `200` with an empty array (not `404`). The search runs entirely against the
        platform's local catalog — no external reference-data provider is contacted (EN004).
      parameters:
        - name: query
          in: query
          required: false
          description: >
            Ticker or part of an instrument name. Trimmed; case insensitive; non-blank.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Zero or more matching selectable listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialInstrumentList'
              examples:
                tickerHit:
                  summary: Exact ticker search
                  value:
                    - id: 6f9619ff-8b86-5d11-b42d-00c04fc964ff
                      name: Apple Inc.
                      ticker: AAPL
                      market: XNAS
                      currency: USD
                      active: true
                noResults:
                  summary: Nothing matches
                  value: []
        '400':
          description: The `query` parameter is missing or blank.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: /problems/invalid-search-query
                title: Search query is required
                status: 400
                detail: Provide a ticker or part of an instrument name to search for.
                instance: /api/financial-instruments

components:
  schemas:

    FinancialInstrumentList:
      type: array
      items:
        $ref: '#/components/schemas/FinancialInstrument'

    FinancialInstrument:
      type: object
      description: >
        A selectable Financial Instrument listing from the local catalog. Normalized and
        provider-neutral — it never exposes source/provider fields.
      required: [id, name, ticker, market, currency, active]
      properties:
        id:
          type: string
          format: uuid
          description: Stable catalog identifier for this listing.
        name:
          type: string
          description: Human-readable instrument name.
        ticker:
          type: string
          description: Normalized trading ticker (uppercase, no provider suffix).
          example: SAN
        market:
          type: string
          description: ISO 10383 Market Identifier Code (MIC) of the listing venue.
          example: XMAD
        currency:
          type: string
          description: ISO 4217 trading/Position currency (initial supported set).
          enum: [EUR, USD]
        isin:
          type: string
          nullable: true
          description: ISO 6166 ISIN when available; `null` otherwise.
          example: ES0113900J37
        active:
          type: boolean
          description: Whether the listing may currently be selected (always `true` in search results).

    CreatePortfolioRequest:
      type: object
      additionalProperties: false
      required: [name, positions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Investor-chosen name. Not required to be unique.
          example: Long-Term Growth
        positions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PositionInput'

    PositionInput:
      type: object
      additionalProperties: false
      required: [ticker, market, quantity, currency]
      properties:
        ticker:
          type: string
          minLength: 1
          maxLength: 20
          example: ASML
        market:
          type: string
          minLength: 1
          maxLength: 20
          description: Market / trading venue. An ISO 10383 MIC is preferred where the investor has one.
          example: XAMS
        quantity:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          description: >
            Number of securities held, as a decimal string. Business rule: must be greater than
            zero — a non-positive value is rejected as a ValidationProblem (code NOT_POSITIVE),
            not a schema error.
          example: "12"
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code for this position's acquisition information.
          example: EUR
        initialPurchaseDate:
          type: string
          format: date
          description: ISO 8601 date. Optional. Must not be in the future.
          example: "2024-05-14"
        averagePurchasePrice:
          type: string
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          description: >
            Optional. Expressed in this position's `currency`. Business rule: must be a positive
            amount — zero/negative is rejected as a ValidationProblem (code NOT_POSITIVE). Omit
            the field entirely when unknown — it is never inferred or defaulted.
          example: "812.50"

    PortfolioSummary:
      type: object
      additionalProperties: false
      description: A portfolio as shown in the Home list — identity, name, and position count only.
      required: [id, name, positionCount]
      properties:
        id:
          type: string
          format: uuid
          description: Portfolio identifier — used to open the detail.
        name:
          type: string
          description: The investor-chosen portfolio name.
        positionCount:
          type: integer
          minimum: 0
          description: Number of positions currently persisted for this portfolio.

    Portfolio:
      type: object
      additionalProperties: false
      required: [id, name, status, positions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE]
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        createdAt:
          type: string
          format: date-time

    Position:
      type: object
      additionalProperties: false
      required: [id, ticker, market, quantity, currency]
      properties:
        id:
          type: string
          format: uuid
        ticker:
          type: string
        market:
          type: string
        quantity:
          type: string
          description: Decimal string, exactly as provided (no precision loss).
        currency:
          type: string
        initialPurchaseDate:
          type: string
          format: date
          nullable: true
          description: null when the investor did not provide it.
        averagePurchasePrice:
          type: string
          nullable: true
          description: >
            Decimal string in `currency`, or null when the investor did not provide it
            (never 0, never inferred).

    PortfolioValuation:
      type: object
      additionalProperties: false
      description: >
        The latest deterministic valuation of one portfolio (FD004). Decimal values are strings,
        full precision — the 2-decimal display rounding is a client concern. A missing value is
        `null`, never `0`.
      required: [portfolioId, status, positions, sectors]
      properties:
        portfolioId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, COMPLETED, PARTIAL, FAILED]
          description: >
            PENDING — no snapshot computed yet. COMPLETED — every position valued (price + needed
            FX); a missing sector alone does not prevent COMPLETED. PARTIAL — some position
            unvalued, a needed FX rate missing, or only one total producible. FAILED — no position
            could be valued, or neither total could be produced.
        calculatedAt:
          type: string
          format: date-time
          nullable: true
          description: When this snapshot was computed. null only for the PENDING placeholder.
        totalValueEUR:
          type: string
          nullable: true
          description: Decimal string. null when not producible (never "0").
        totalValueUSD:
          type: string
          nullable: true
          description: Decimal string. null when not producible (never "0").
        marketDataAsOf:
          type: string
          format: date-time
          nullable: true
          description: Oldest market-price observation time among the valued positions.
        fxDataAsOf:
          type: string
          format: date-time
          nullable: true
          description: Oldest FX-rate observation time among the rates used.
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionValuation'
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/SectorAllocation'

    PositionValuation:
      type: object
      additionalProperties: false
      required: [ticker, market, quantity, nativeCurrency, valued, sector]
      properties:
        ticker:
          type: string
        market:
          type: string
          description: Market Identifier Code (MIC).
        quantity:
          type: string
          description: Decimal string.
        nativeCurrency:
          type: string
          enum: [EUR, USD]
        valued:
          type: boolean
          description: >
            true when a market price was available. When false every monetary field below is null
            (never "0").
        marketPrice:
          type: string
          nullable: true
        nativeMarketValue:
          type: string
          nullable: true
          description: quantity x marketPrice, full precision.
        valueInEUR:
          type: string
          nullable: true
        valueInUSD:
          type: string
          nullable: true
        portfolioWeight:
          type: string
          nullable: true
          description: >
            Fraction of the portfolio's total EUR value (e.g. "0.761904761905"). The client
            multiplies by 100 and formats to 2 decimals. null when there is no EUR basis.
        sector:
          type: string
          description: Provider classification string shown directly, or "Unclassified".
        priceObservedAt:
          type: string
          format: date-time
          nullable: true

    SectorAllocation:
      type: object
      additionalProperties: false
      required: [sector, sectorValueEUR, sectorWeight]
      properties:
        sector:
          type: string
        sectorValueEUR:
          type: string
          description: Sum of valueInEUR for that sector's valued positions, full precision.
        sectorWeight:
          type: string
          description: Fraction (sectorValueEUR / totalValueEUR); client multiplies by 100.

    Problem:
      type: object
      description: RFC 9457 problem detail.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Stable, machine-readable problem identifier (URI reference).
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    ValidationProblem:
      type: object
      description: >
        RFC 9457 problem detail for a portfolio that breaks one or more business rules. Carries the
        same members as `Problem` plus a non-empty `errors` array (one entry per broken rule).
      required: [type, title, status, errors]
      properties:
        type:
          type: string
          description: Stable, machine-readable problem identifier (URI reference).
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          minItems: 1
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
                description: >
                  Path to the offending input, e.g. `name`, `positions`,
                  `positions[1].quantity`.
              code:
                type: string
                enum:
                  - REQUIRED
                  - AT_LEAST_ONE
                  - INVALID_NUMBER
                  - INVALID_DATE
                  - NOT_POSITIVE
                  - DUPLICATE_INSTRUMENT
                  - FUTURE_DATE
                  - CURRENCY_FORMAT
                  - NAME_TOO_LONG
                  - INSTRUMENT_NOT_IN_CATALOG
                description: >
                  Stable machine token identifying the rule that failed. `REQUIRED` … `NAME_TOO_LONG`
                  are the FD001 structural/business codes. `INSTRUMENT_NOT_IN_CATALOG` (FD002) means
                  the position's `ticker + market + currency` does not, as a whole, correspond to one
                  active Financial Instrument listing in the platform catalog — the instrument is
                  unknown, inactive, on a different market, or the submitted currency differs from the
                  listing's currency.
              message:
                type: string
