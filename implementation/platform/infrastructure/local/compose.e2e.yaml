# EN002 — E2E isolation override.
#
# Applied ONLY by implementation/platform/e2e.sh:
#   docker compose -p finai-e2e -f compose.yaml -f compose.e2e.yaml --profile e2e ...
#
# Purpose (OD-6, OD-EN002-4): every E2E run is fully isolated from the developer's normal platform.
#   - `postgres` uses a DISPOSABLE, project-scoped volume — `e2e.sh` removes it with `down -v`.
#     The persistent `my-finai-manager-postgres-data` volume is NEVER referenced here.
#   - published host ports are shifted (15432 / 18080 / 14200) so an E2E run can happen while the
#     normal `./start.sh` platform is also up, with no port collision.
#
# `!override` replaces the base list instead of merging it (needs Docker Compose >= 2.24).

services:
  postgres:
    volumes: !override
      - e2e-postgres-data:/var/lib/postgresql/data
    ports: !override
      - "15432:5432"

  # FD004 — the external market-data boundary for E2E. A tiny dependency-free Node stub (built by
  # e2e.sh) that serves canned Finnhub /quote + /stock/profile2 AND Frankfurter /v1/latest (FX)
  # responses. EN005's REAL adapters / mappers / cache / error-translation run against it — no live
  # finnhub.io / api.frankfurter.dev, no outbound Internet (SC-010).
  finnhub-stub:
    image: finai/finnhub-stub:local
    pull_policy: never
    build:
      context: ../../e2e/finnhub-stub
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  backend:
    ports: !override
      - "18080:8080"
    environment:
      # EN005 talks to the stub instead of the live providers. The Finnhub key is a non-secret
      # placeholder (the stub ignores it) but must be non-blank so the integration is enabled.
      # Frankfurter needs no key; only its base URL is redirected.
      FINNHUB_API_KEY: e2e-stub
      FINNHUB_BASE_URL: http://finnhub-stub:8080
      FRANKFURTER_BASE_URL: http://finnhub-stub:8080
    depends_on:
      finnhub-stub:
        condition: service_healthy

  frontend:
    ports: !override
      - "14200:80"

volumes:
  # Project-scoped (`finai-e2e_e2e-postgres-data`); disposable — no fixed `name:`.
  e2e-postgres-data:
