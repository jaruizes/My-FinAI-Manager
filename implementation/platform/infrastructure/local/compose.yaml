# Local executable platform for My-FinAI-Manager.
#
# EN001 introduced PostgreSQL. EN002 makes the WHOLE platform run as containers: `postgres`,
# `backend` (Spring Boot), `frontend` (Angular build served by nginx), and an opt-in `e2e`
# (Playwright) service behind the `e2e` profile. EN006 / ADR-004 adds the local AI observability
# stack: `otel-collector`, `jaeger`, `prometheus`, `grafana` — core-service exports OTLP traces and
# metrics to the Collector, which fans out traces to Jaeger and metrics to Prometheus; Grafana is
# auto-provisioned with a Prometheus data source and the AI observability dashboard. Config lives
# in ../observability/ (version-controlled, mounted read-only — see contracts/ai-telemetry.md and
# ADR-004 in the EN006 spec/enabler).
#
# Started / stopped through implementation/platform/start.sh and stop.sh.
# Browser E2E is run through implementation/platform/e2e.sh (isolated Compose project).
#
# No container_name is set anywhere, so `e2e.sh` can run this same file under a separate Compose
# project name (`-p finai-e2e`) without name collisions.
# No `platform:` is pinned — images build/run for the host architecture.
#
# Each buildable service declares BOTH `image:` (a stable local tag) and `build:` (the context).
# start.sh / e2e.sh build the images with `docker build` and then run `docker compose up --no-build`
# — this keeps orchestration in Compose while remaining compatible with the local Buildx plugin
# version (`docker compose build` needs Buildx >= 0.17). `docker compose build` also works where a
# newer Buildx is installed.

name: my-finai-manager-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finai}
      POSTGRES_USER: ${POSTGRES_USER:-finai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finai_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finai} -d ${POSTGRES_DB:-finai}"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    image: finai/core-service:local
    # Locally built by start.sh / e2e.sh — never pulled from a registry.
    pull_policy: never
    build:
      context: ../../backend/core-service
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/finai}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-finai}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-finai_local_dev}
      # EN005 / FD004 — Finnhub market data. Taken from the shell environment or infrastructure/
      # local/.env (git-ignored). BLANK ⇒ the integration is disabled and portfolio valuations come
      # back FAILED, while every other capability keeps working. The key is a real secret: put it
      # ONLY in .env or export it before ./start.sh — never in .env.example or the repo. It is sent
      # to Finnhub as the X-Finnhub-Token header, never a URL parameter.
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FINNHUB_BASE_URL: ${FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
      # EN006 / ADR-004 — export AI telemetry to the local OpenTelemetry Collector. No AI provider
      # credential is ever carried by this configuration (there is none — EN006 ships no live
      # provider, resolved Q1).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-my-finai-manager-core}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    image: finai/web:local
    pull_policy: never
    build:
      context: ../../frontend/web
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  # EN006 / ADR-004 — local AI observability stack. Receives OTLP traces/metrics from `backend`
  # and fans them out: traces -> jaeger, metrics -> a Prometheus-scrapeable endpoint. Config is
  # version-controlled (../observability/otel-collector-config.yaml) and never dumps raw
  # prompt/completion bodies.
  # No Docker HEALTHCHECK here: the otel/opentelemetry-collector-contrib image ships no shell and
  # no wget/curl binary (verified), so a container-internal HTTP probe isn't possible without adding
  # one ourselves. `backend`/`jaeger`/`prometheus` only need it to have *started*
  # (`service_started`); start.sh separately confirms the container is actually running.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

  # Trace store + UI (contracts/ai-telemetry.md — the ai.usecase / ai.invocation span pair).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:16686/ >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Metrics store, scraping the Collector's Prometheus-exporter endpoint (../observability/prometheus.yml).
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Auto-provisioned dashboard (Prometheus data source + the AI observability dashboard — FR-051).
  # No manual "Add data source" / "Import dashboard" step is ever required.
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Browser E2E runner — never started by a plain `docker compose up` (profile-gated).
  # Driven by implementation/platform/e2e.sh.
  e2e:
    image: finai/e2e:local
    pull_policy: never
    build:
      context: ../../e2e
    profiles:
      - e2e
    environment:
      E2E_BASE_URL: ${E2E_BASE_URL:-http://frontend}
    volumes:
      - ../../e2e/test-results:/work/test-results
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres-data:
    name: my-finai-manager-postgres-data
