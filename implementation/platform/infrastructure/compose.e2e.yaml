# Overlay adding the containerized Playwright runner (EN001 FR-012, AC-012).
# Usage: docker compose -f compose.yaml -f compose.e2e.yaml run --rm playwright

services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    working_dir: /e2e
    volumes:
      - ../e2e:/e2e
    environment:
      E2E_BASE_URL: http://frontend:8080
      CI: "true"
    depends_on:
      frontend:
        condition: service_healthy
    command: ["sh", "-lc", "npm ci --no-audit --no-fund && npx playwright test"]
