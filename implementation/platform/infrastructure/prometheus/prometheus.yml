global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics, exported by the OpenTelemetry Collector.
  - job_name: core-service
    static_configs:
      - targets: ['otel-collector:8889']

  # The Collector's own internal telemetry.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
