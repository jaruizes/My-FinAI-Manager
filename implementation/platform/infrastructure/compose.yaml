# Canonical local runtime for the My-FinAI-Manager executable platform (EN001).
# Everything runs as a container — no host-run Angular / Spring Boot / PostgreSQL.
# Started/stopped through implementation/platform/{start,stop,e2e}.sh.

name: myfinaimanager-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myfinaimanager
      POSTGRES_USER: myfinaimanager
      POSTGRES_PASSWORD: myfinaimanager   # local dev only — not a secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfinaimanager -d myfinaimanager"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  core-service:
    image: myfinaimanager/core-service:local
    build:
      context: ../backend/core-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myfinaimanager
      SPRING_DATASOURCE_USERNAME: myfinaimanager
      SPRING_DATASOURCE_PASSWORD: myfinaimanager
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: core-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=myfinaimanager,deployment.environment=local
      # Prometheus needs cumulative counters (the agent defaults to delta for OTLP).
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  frontend:
    image: myfinaimanager/frontend:local
    build:
      context: ../frontend/web
    ports:
      - "8080:8080"
    depends_on:
      core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    expose:
      - "4317"
      - "4318"
      - "8889"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    expose:
      - "4317"

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin          # local dev only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
