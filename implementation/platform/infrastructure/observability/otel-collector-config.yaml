# EN006 / ADR-004 — local AI observability stack: OpenTelemetry Collector configuration.
#
# core-service exports OTLP traces + metrics here (management.otlp.* in application.yml); this
# Collector forwards traces to Jaeger and exposes metrics on a Prometheus-scrapeable endpoint.
#
# Deliberately NO `debug`/`logging` exporter is enabled — it would dump full span/metric payloads
# (including any attribute value) to the container's stdout, which risks exporting more than the
# safe telemetry contract (contracts/ai-telemetry.md) intends. Add one locally only if you need to
# debug the pipeline itself, never by default.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
