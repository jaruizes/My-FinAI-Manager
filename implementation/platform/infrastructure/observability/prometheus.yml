# EN006 / ADR-004 — Prometheus scrapes the OpenTelemetry Collector's Prometheus-exporter endpoint
# (otel-collector-config.yaml), which is where core-service's AI metrics (contracts/ai-telemetry.md)
# land after passing through the Collector.

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
