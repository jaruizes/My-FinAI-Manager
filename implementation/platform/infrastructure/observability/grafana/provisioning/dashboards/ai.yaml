# EN006 / ADR-004 — auto-provisions the AI observability dashboard (FR-051) from the version
# controlled JSON in ../../grafana/dashboards/. No manual dashboard import is ever required.
apiVersion: 1

providers:
  - name: ai-observability
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
