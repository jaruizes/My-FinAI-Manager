# EN002 — nginx runtime config for the Angular frontend container.
#
#   /        -> the Angular production build (SPA fallback so deep links like /portfolios/new work)
#   /api/*   -> reverse-proxied to the `backend` Compose service, path preserved
#
# The browser only ever talks to this origin; it never resolves the Docker service name `backend`
# (OD-5). The Angular app calls the API with relative `/api` URLs.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload ceiling for JSON request bodies.
    client_max_body_size 2m;

    # Business API — forward to the backend container, preserving the full /api/... path.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Static assets + SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets; never cache index.html.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
