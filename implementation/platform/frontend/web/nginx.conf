# Serves the built Angular app and reverse-proxies the browser's /api calls to
# the backend. The browser only ever talks to this origin, so no Docker-internal
# service name appears in shipped JavaScript (EN001 §10 — stable routing).

upstream core_service {
    server core-service:8080;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Lightweight endpoint for container health checks.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Business API — forwarded to the backend, path preserved (/api/v1/hello).
    location /api/ {
        proxy_pass http://core_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
