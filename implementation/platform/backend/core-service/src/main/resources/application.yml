spring:
  application:
    name: core-service

  datasource:
    # Externalized configuration (DR-032). Local defaults point at the Docker Compose PostgreSQL
    # started by implementation/platform/start.sh, using SYNTHETIC non-production credentials.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finai}
    username: ${SPRING_DATASOURCE_USERNAME:finai}
    password: ${SPRING_DATASOURCE_PASSWORD:finai_local_dev}

  flyway:
    enabled: true
    # Tolerate PostgreSQL not being ready yet at startup (spec edge case; research.md D2).
    connect-retries: 10
    connect-retries-interval: 3
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    # EN003 / ADR-003: Flyway owns the schema — Hibernate MUST NOT create or evolve it.
    hibernate:
      ddl-auto: none
    # No Open Session In View: the persistence mapper (not a view render) reads the aggregate.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Match the existing Instant/Timestamp handling (created_at is TIMESTAMPTZ).
          time_zone: UTC

  mvc:
    # RFC 9457 application/problem+json error bodies (FD001 research.md D4, AR-012).
    problemdetails:
      enabled: true

# EN004 — Financial Instrument reference data (financialinstrument module).
# The reference CSVs are packaged as classpath resources (no host file, no runtime mount).
# `import-on-startup` runs the mapping-driven import once on boot; it is idempotent and safe to
# re-run (container restart). Test slices set it false and drive the import explicitly.
# No secrets here.
app:
  reference-data:
    import-on-startup: true
    markets-file: "classpath:reference-data/markets.csv"
    instruments-file: "classpath:reference-data/instruments.sample.csv"
    exchange-mic-mapping-file: "classpath:reference-data/yahoo-exchange-to-mic-mapping.csv"
    suffix-override-file: "classpath:reference-data/yahoo-exchange-suffix-overrides.csv"

# EN005 — Finnhub market data integration (marketdata module).
# The API key is supplied per environment via FINNHUB_API_KEY and is NEVER committed. When it is
# unset the integration is DISABLED: the application starts normally, a one-time INFO log
# `event=FinnhubIntegrationDisabled` is emitted, and every marketdata port call throws
# MarketDataNotConfiguredException. The key is sent to Finnhub as the `X-Finnhub-Token` request
# header — never a URL query parameter — so it cannot appear in a URL, log line, or exception.
# EN005 Revision 2 — provider selection is independent per capability (enabler §7, §16). Each value
# names the adapter wired for that capability; a value naming an unregistered provider is a
# misconfiguration. Initial assignment: price + profile → Finnhub (US equities), FX → Frankfurter.
market-data:
  price:
    provider: finnhub
  profile:
    provider: finnhub
  fx:
    provider: frankfurter

finnhub:
  api-key: ${FINNHUB_API_KEY:}
  # Overridable per environment (FINNHUB_BASE_URL) so the containerized E2E can point EN005's real
  # adapter at a controlled Finnhub stub (FD004 §25). The production default is unchanged.
  base-url: ${FINNHUB_BASE_URL:https://finnhub.io/api/v1}
  connect-timeout: 2s
  read-timeout: 5s
  cache:
    quote-ttl: 45s
    profile-ttl: 24h    # unused after Revision 2 (instrument profile is database-first); kept until the field is removed

# EN005 Revision 2 — FX rates come from Frankfurter (ECB data), a keyless public API. No secret.
# base-url is overridable (FRANKFURTER_BASE_URL) so the containerized E2E can point at a stub.
frankfurter:
  base-url: ${FRANKFURTER_BASE_URL:https://api.frankfurter.dev}
  connect-timeout: 2s
  read-timeout: 5s
  cache:
    fx-ttl: 10m

# EN006 — provider-neutral AI model integration (ai module). `default-provider: local` selects the
# shipped deterministic LocalAiModelAdapter for any task with no override below — needs no key,
# makes no outbound call. Limits/timeout/retry are placeholder defaults (research.md D-plan; spec.md
# A8) — safe to tune without any code change.
# FD005 / research D1 — per-task provider routing: "portfolio-analysis" is routed to the real
# OpenAI adapter; every other task (incl. EN006's own "diagnostic") is unaffected and keeps using
# `default-provider`.
ai:
  default-provider: local
  default-model: local-deterministic-v1
  limits:
    max-input-tokens: 8000
    max-output-tokens: 1000
    max-total-tokens: 9000
    max-input-characters: 20000
    max-estimated-cost: 0.50
  timeout:
    connect: 2s
    read: 5s
  retry:
    max-attempts: 2
    backoff: 200ms
  tasks:
    portfolio-analysis:
      provider: openai

# FD005 research D3 — the real OpenAI provider adapter (ai.infrastructure.provider.openai). The API
# key is supplied per environment via OPENAI_API_KEY and is NEVER committed. When it is unset the
# adapter is unusable: every call throws AiProviderNotConfiguredException with NO outbound call —
# mirrors EN005's Finnhub blank-key behavior exactly. The key is sent as the `Authorization: Bearer`
# request header — never a URL query parameter. Pricing is a documented placeholder (spec A1),
# overridable without any code change.
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  connect-timeout: 3s
  read-timeout: 20s
  pricing:
    input-per1k: 0.00015
    output-per1k: 0.0006

management:
  endpoints:
    web:
      exposure:
        # health (EN001) + aidiagnostic (EN006 — internal observability-verification tool only,
        # NOT a business API; contracts/ai-diagnostic-endpoint.md). Actuator endpoint URLs are the
        # lowercased id with no separator, so @Endpoint(id = "aidiagnostic") -> /actuator/aidiagnostic.
        include: health,aidiagnostic
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    aidiagnostic:
      enabled: true
  health:
    db:
      enabled: true
  # EN006 / research D1 — the platform's first OpenTelemetry telemetry export. Sampled 100% for
  # local dev; exported to the local OTel Collector (ADR-004). No AI provider credential is ever
  # carried by this configuration.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

# Structured, machine-readable logging (DR-029), via Spring Boot's built-in structured logging
# in Elastic Common Schema JSON. No custom logback config — a `logback-spring.xml` that includes
# the plain `console-appender.xml` silently overrides this. For a readable plain console during
# local debugging, set LOG_STRUCTURED_FORMAT= (empty).
# Never log secrets, tokens, credentials or sensitive portfolio data (DR-030).
logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}
