name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/validate-pr-title.sh "$PR_TITLE"

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: implementation/platform/backend/core-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: implementation/platform/backend/core-service/pom.xml

      - name: Build and run backend tests
        run: |
          if [ -x "./mvnw" ]; then
            ./mvnw --batch-mode --no-transfer-progress clean verify
          else
            mvn --batch-mode --no-transfer-progress clean verify
          fi

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: implementation/platform/frontend/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: implementation/platform/frontend/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test -- --watch=false

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - validate-pr-title
    if: |
      always() &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      (github.event_name == 'push' || needs.validate-pr-title.result == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run containerized E2E tests
        run: |
          chmod +x implementation/platform/e2e.sh
          ./implementation/platform/e2e.sh

      - name: Collect Docker diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/e2e-diagnostics
          docker ps -a > /tmp/e2e-diagnostics/docker-ps.txt || true
          docker compose             -f implementation/platform/infrastructure/local/compose.yaml             logs --no-color > /tmp/e2e-diagnostics/compose.log 2>&1 || true

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: /tmp/e2e-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop platform
        if: always()
        run: |
          chmod +x implementation/platform/stop.sh
          ./implementation/platform/stop.sh || true
